apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app
  namespace: fitness-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-app
  template:
    metadata:
      labels:
        app: fitness-app
    spec:
      containers:
        - name: fitness-app
          image: kind-registry:5000/fitness-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: DB_NAME
              value: fitness_tracker
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-app
  namespace: fitness-tracker
spec:
  type: NodePort
  selector:
    app: fitness-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
